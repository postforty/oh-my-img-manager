<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="extShortName">Oh My Image Manager</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body class="dark-theme">
  <div class="popup-container">
    <div class="popup-header">
      <div class="logo-icon-wrap" data-i18n-title="extShortName" title="Oh My Image Manager">
        <img src="../icons/icon48.png" alt="Oh My Image Manager" class="logo-img" />
      </div>
      <div class="header-info">
        <h3 data-i18n="extShortName">Oh My Image Manager</h3>
        <p data-i18n="popupSubTitle">스마트 이미지 매니저 & 일괄 크롭기</p>
      </div>
      <div class="header-actions">
        <select id="selectLang" class="popup-lang-select" aria-label="UI Language">
          <option value="auto" data-i18n="langAuto">자동 감지 (Auto)</option>
          <option value="ko" data-i18n="langKo">한국어</option>
          <option value="en" data-i18n="langEn">English</option>
        </select>
        <button id="btnOpenGuide" class="btn-guide-icon" data-i18n-title="userGuide" title="사용 설명서">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </button>
      </div>
    </div>

    <div class="popup-body">
      <button id="btnOpenRemover" class="btn btn-magic">
        <span class="btn-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83">
            </path>
          </svg>
        </span>
        <span class="btn-text">
          <strong data-i18n="popupBtnRemoverTitle">스마트 배경 제거 (누끼) 스튜디오</strong>
          <small data-i18n="popupBtnRemoverDesc">AI 원클릭 투명 배경 & 리터치 브러시 (단일 편집)</small>
        </span>
      </button>

      <button id="btnOpenWorkspace" class="btn btn-primary">
        <span class="btn-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
        </span>
        <span class="btn-text">
          <strong data-i18n="popupBtnWorkspaceTitle">대량 일괄 크롭 워크스페이스</strong>
          <small data-i18n="popupBtnWorkspaceDesc">드래그 앤 드롭으로 수십 장 일괄 크롭 & ZIP 압축</small>
        </span>
      </button>

      <div class="divider"><span data-i18n="popupDividerOr">또는</span></div>

      <button id="btnCaptureCurrentTab" class="btn btn-outline">
        <span class="btn-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
        </span>
        <span class="btn-text">
          <strong data-i18n="popupBtnCaptureTitle">웹 화면 영역 지정 캡처</strong>
          <small data-i18n="popupBtnCaptureDesc">원하는 영역을 캡처 후 누끼 스튜디오에서 편집</small>
        </span>
      </button>
    </div>

    <div class="popup-footer">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <span data-i18n="popupFooterPrivacy">모든 이미지는 서버 전송 없이 안전하게 처리됩니다</span>
    </div>
  </div>

  <script src="../i18n.js"></script>
  <script src="../lib/jszip.min.js"></script>
  <script src="../workspace/cropper-engine.js"></script>
  <script src="popup.js"></script>
</body>

</html>
